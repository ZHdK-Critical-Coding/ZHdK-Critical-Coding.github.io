title: Critical Coding
subtitle: Code Samples
subtitle_de: Code-Beispiele
description: Coding examples of the Critical Coding course at ZHdK.
url: https://zhdk-critical-coding.github.io
baseurl: ""

# GitHub organisation the examples are collected from (see scripts/update.rb)
github_org: ZHdK-Critical-Coding

# Top menu, left to right. `menu` fills the dropdown:
#   main_categories  the main categories below
# Without `menu` the entry is a plain link.
nav:
  - id: literature
    title: Literature
    title_de: Literatur
    url: /literature/
  - id: how-tos
    title: How-To's
    title_de: Anleitungen
    url: /how-tos/
  - id: code-samples
    title: Code Samples
    title_de: Code-Beispiele
    url: /
    menu: main_categories

# Zotero collection for the Literature pages (scripts/literature.rb)
literature:
  collection: Critical Coding/Export
  # Categories (Zotero tags XX_…, ordered by their number) and the name shown
  # for each. Rewritten by scripts/literature.rb on every Zotero pull: new
  # categories are added, unused ones removed; names you change here are kept.
  categories:
    01_Gesellschaft: "Gesellschaft"
    02_Medientheorie: "Medientheorie"
    03_Informationstechnologie: "Informationstechnologie"
    04_Ueberwachung_und_Macht: "Überwachung und Macht"
    05_Gestaltung_&_Design: "Gestaltung & Design"
    06_Coding_und_Praxis: "Coding und Praxis"
    07_KI_und_Algorithmen: "KI und Algorithmen"
    08_Geschichte: "Geschichte"
    09_Wirtschaftskritik: "Wirtschaftskritik"

# Main categories (pages, chosen in the header dropdown) and their
# categories (columns, in this order). example.yaml sets both:
#   maincategory: code-samples
#   category: input
main_categories:
  - id: code-samples
    title: Input Output
    title_de: Input Output
    url: /
    categories:
      - input
      - transformation
      - output
  - id: utilities
    title: Utilities
    title_de: Werkzeuge
    url: /utilities/
    categories:
      - servers
      - arduino
      - editors
  - id: document-generation
    title: Document Generation
    title_de: Dokumente erzeugen
    url: /document-generation/
    categories:
      - batch-mode

collections:
  examples:
    output: true
    permalink: /examples/:name/

defaults:
  - scope:
      path: ""
      type: examples
    values:
      layout: example

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - docs
  - vendor
  - .cache
