# Builds the site and publishes it to GitHub Pages.
#
# Runs on every push, manually ("Run workflow"), nightly, and whenever an
# example repository sends a `repository_dispatch` of type `example-updated`
# (see docs/notify-site.yml).
#
# Needs the repository secret EXAMPLES_TOKEN: a fine-grained personal access
# token (resource owner: ZHdK-Critical-Coding, all repositories, read-only
# "Contents" + "Metadata"). Without it the committed _examples are used as-is.
#
# Optional repository secret ZOTERO_API_KEY: a read-only Zotero key for the
# Literature pages (scripts/literature.rb). Without it, or if Zotero cannot be
# reached, the committed _data/literature.json is used.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [example-updated]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXAMPLES_TOKEN: ${{ secrets.EXAMPLES_TOKEN }}
      ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Collect examples from the organisation
        if: env.EXAMPLES_TOKEN != ''
        run: bundle exec ruby scripts/update.rb
        env:
          GITHUB_TOKEN: ${{ secrets.EXAMPLES_TOKEN }}

      - name: Collect literature from Zotero
        if: env.ZOTERO_API_KEY != ''
        continue-on-error: true
        run: bundle exec ruby scripts/literature.rb

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
